name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The schema lives outside Prisma's default directory. Generate its
      # client and enums before tests import the matching services.
      - name: Generate Prisma client
        run: npm run db:generate
      - run: npm test
      - run: npm run build
      - run: node --check server/index.js
